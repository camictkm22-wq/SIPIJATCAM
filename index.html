<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SiPijat">
<title>SiPijat CAM</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#F8FAFC;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F8FAFC}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#F8FAFC;color:#1B2A4A;font-weight:700;z-index:2;transition:opacity .3s}
  #load .s{width:28px;height:28px;border:3px solid #1B2A4A;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
  #off{display:none;position:fixed;left:0;right:0;top:0;z-index:3;background:#B45309;color:#fff;text-align:center;font-size:13px;padding:6px}
</style>
</head>
<body>
<div id="off">Tidak ada koneksi internet</div>
<div id="load"><div class="s"></div>SiPijat CAM</div>
<!-- ⚠️ GANTI dengan URL Web App (…/exec) hasil Deploy Google Apps Script Anda -->
<iframe id="app" title="SiPijat CAM" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzIHD9XpEkSwS2RAsAKjSquZcB4Iq5_7VThwExLWApPJSMvuEdKdD4AXoDbfIoOvIff/exec';
  const f = document.getElementById('app');
  f.src = GAS_URL;
  f.addEventListener('load', () => { const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(() => l.remove(), 300); send(); });
  // Jembatan pemasangan PWA: tombol "Pasang di layar utama" di dalam aplikasi memicu prompt di sini.
  let ev = null; const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  function send() { try { f.contentWindow.postMessage({ type: 'pwa-state', canInstall: !!ev, standalone: !!standalone }, '*'); } catch (e) { } }
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; send(); });
  addEventListener('appinstalled', () => { ev = null; send(); });
  addEventListener('message', e => { if (e.data && e.data.type === 'pwa-install' && ev) { ev.prompt(); ev.userChoice.finally(() => { ev = null; send(); }); } });
  const off = document.getElementById('off'), st = () => off.style.display = navigator.onLine ? 'none' : 'block'; addEventListener('online', st); addEventListener('offline', st); st();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
</script>
</body>
</html>
